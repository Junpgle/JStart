<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JStart</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg">
</head>
<body>
  <div class="background" id="background"></div>
  <button class="theme-btn" id="themeBtn" title="切换主题">
    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <svg class="icon-auto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
      <line x1="8" y1="21" x2="16" y2="21"></line>
      <line x1="12" y1="17" x2="12" y2="21"></line>
    </svg>
  </button>
  <div class="container">
    <div class="search-section">
      <div class="search-box">
        <div class="engine-selector">
          <button class="engine-btn active" data-engine="bing">Bing</button>
          <button class="engine-btn" data-engine="google">Google</button>
          <button class="engine-btn" data-engine="baidu">百度</button>
        </div>
        <div class="input-wrapper">
          <input type="text" id="searchInput" placeholder="搜索..." autocomplete="off">
          <button id="searchBtn" class="search-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </button>
        </div>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>
    <div class="shortcuts-section">
      <div class="shortcuts-grid" id="shortcutsGrid"></div>
      <button class="add-shortcut-btn" id="addShortcutBtn">+</button>
    </div>
  </div>
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3>添加快捷方式</h3>
      <input type="text" id="shortcutName" placeholder="名称">
      <input type="url" id="shortcutUrl" placeholder="网址">
      <div class="modal-actions">
        <button id="cancelBtn">取消</button>
        <button id="saveBtn">保存</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
