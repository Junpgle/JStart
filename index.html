<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JStart</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg">
</head>
<body>
  <div class="background" id="background"></div>
  <div class="container">
    <div class="search-section">
      <div class="search-box">
        <div class="engine-selector">
          <button class="engine-btn active" data-engine="bing">Bing</button>
          <button class="engine-btn" data-engine="google">Google</button>
          <button class="engine-btn" data-engine="baidu">百度</button>
        </div>
        <div class="input-wrapper">
          <input type="text" id="searchInput" placeholder="搜索..." autocomplete="off">
          <button id="searchBtn" class="search-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </button>
        </div>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>
    <div class="shortcuts-section">
      <div class="shortcuts-grid" id="shortcutsGrid"></div>
      <button class="add-shortcut-btn" id="addShortcutBtn">+</button>
    </div>
  </div>
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3>添加快捷方式</h3>
      <input type="text" id="shortcutName" placeholder="名称">
      <input type="url" id="shortcutUrl" placeholder="网址">
      <div class="modal-actions">
        <button id="cancelBtn">取消</button>
        <button id="saveBtn">保存</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
